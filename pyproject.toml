[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imap-tools"
dynamic = ["version"]
description = "Work with email by IMAP"
readme = "README.rst"
license = { text = "Apache-2.0" }
authors = [{ name = "Vladimir Kaukin", email = "KaukinVK@ya.ru" }]
keywords = ["imap", "imap-client", "python3", "python", "email"]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Topic :: Internet",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ikvk/imap_tools"
Changelog = "https://github.com/ikvk/imap_tools/blob/master/docs/release_notes.rst"
"Bug Tracker" = "https://github.com/ikvk/imap_tools/issues"

[tool.hatch.version]
path = "imap_tools/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/docs",
    "/examples",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["imap_tools"]

# ---------------------------------------------------------------------------
# Test environments  (hatch test / hatch test --python 3.12)
# ---------------------------------------------------------------------------

[tool.hatch.envs.hatch-test]

[tool.hatch.envs.hatch-test.scripts]
run = "python -m unittest discover -s tests -t tests"
run-cov = "python -m unittest discover -s tests -t tests"
cov-combine = ""
cov-report = ""

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
